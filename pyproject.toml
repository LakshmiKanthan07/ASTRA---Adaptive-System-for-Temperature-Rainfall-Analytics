[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-fuse"
version = "0.1.0"
description = "Adaptive Intelligent Forecast Unification & Skill Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "xgboost",
    "lightgbm",
    "xarray",
    "netCDF4",
    "cfgrib",
    "pydantic",
    "numpy",
    "scipy",
    "pandas",
    "fastapi",
    "uvicorn",
    "streamlit",
    "mlflow",
    "apache-airflow",
    "ecmwf-opendata",
    "herbie-data",
    "cdsapi"
]

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
