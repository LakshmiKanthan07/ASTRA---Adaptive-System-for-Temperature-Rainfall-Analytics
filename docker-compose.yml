version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./models:/app/models
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      - PYTHONPATH=/app/src

  dashboard:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./models:/app/models
    command: streamlit run src/dashboard/app.py
    environment:
      - PYTHONPATH=/app/src

  airflow:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/app/airflow/dags
      - ./data:/app/data
      - ./config:/app/config
      - ./models:/app/models
    command: bash -c "airflow db init && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com && airflow webserver & airflow scheduler"
    environment:
      - AIRFLOW_HOME=/app/airflow
      - PYTHONPATH=/app/src